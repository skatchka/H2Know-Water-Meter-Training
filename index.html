on.\n\nThe sensor should come up with a FAST BLINKING GREEN L E D\n\n(i.e. 200 milliseconds GREEN on, 200 milliseconds off, repeat). \n\nIn approximately 3 minutes (or less), the sensor should reboot and display a SLOW BLINKING GREEN L E D\n\n(i.e. 50 milliseconds GREEN on, 3 seconds off, repeat).\n\nThis indicates the software on the sensor has been restored and the sensor is actively transmitting data.","voiceCode":"en-GB-AbbiNeural","language":"en","originalResourceId":"EZtK8dMKC3FejRLGp","ssml":"\u003cspeak \n            xmlns=\"http://www.w3.org/2001/10/synthesis\"\n            xmlns:mstts=\"http://www.w3.org/2001/mstts\"\n            xmlns:emo=\"http://www.w3.org/2009/10/emotionml\" \n            version=\"1.0\" \n            xml:lang=\"en\"\n          >\n            \u003cvoice name=\"en-GB-AbbiNeural\">H2Know Factory Reset Process\u003cbreak time=\"0.5s\"/>\u003cbreak time=\"0.5s\"/>\u003cbreak time=\"0.5s\"/>A factory reset, also known as hard reset or master reset, is a software restore of the firmware on your H2know sensor. A factory reset can fix chronic performance issues with the sensor (i.e. freezing), but it does not remove the sensor’s operating system or the Wi-Fi credentials stored in its memory. \u003cbreak time=\"0.5s\"/> \u003cbreak time=\"0.4s\"/>\u003cbreak time=\"0.5s\"/>To perform a factory reset: \u003cbreak time=\"0.5s\"/>\u003cbreak time=\"0.4s\"/>\u003cbreak time=\"0.5s\"/>Remove power from the sensor.\u003cbreak time=\"0.5s\"/>\u003cbreak time=\"0.3s\"/>\u003cbreak time=\"0.5s\"/>Press and hold the “Reset” button on the face of the sensor.\u003cbreak time=\"0.5s\"/>\u003cbreak time=\"0.3s\"/>\u003cbreak time=\"0.5s\"/>Connect power to the sensor while continuing to press and hold the “Reset” button.\u003cbreak time=\"0.5s\"/>\u003cbreak time=\"0.3s\"/>\u003cbreak time=\"0.5s\"/>Continue pressing the “Reset” button for 6 seconds, then release the button.\u003cbreak time=\"0.5s\"/>\u003cbreak time=\"0.3s\"/>\u003cbreak time=\"0.5s\"/>The sensor should come up with a FAST BLINKING GREEN L E D\u003cbreak time=\"0.5s\"/>\u003cbreak time=\"0.2s\"/>\u003cbreak time=\"0.5s\"/>(i.e. 200 milliseconds GREEN on, 200 milliseconds off, repeat). \u003cbreak time=\"0.5s\"/>\u003cbreak time=\"0.3s\"/>\u003cbreak time=\"0.5s\"/>In approximately 3 minutes (or less), the sensor should reboot and display a SLOW BLINKING GREEN L E D\u003cbreak time=\"0.5s\"/>\u003cbreak time=\"0.2s\"/>\u003cbreak time=\"0.5s\"/>(i.e. 50 milliseconds GREEN on, 3 seconds off, repeat).\u003cbreak time=\"0.5s\"/>\u003cbreak time=\"0.2s\"/>\u003cbreak time=\"0.5s\"/>This indicates the software on the sensor has been restored and the sensor is actively transmitting data.\u003c/voice>\n          \u003c/speak>"},"captionData":{"status":"success","captions":[{"text":"H2 nofactory reset process.","startTime":0.09,"finishTime":2.309},{"text":"A factory reset,","startTime":3.9,"finishTime":5.21},{"text":"also known as hard reset or master reset,","startTime":5.42,"finishTime":8.199},{"text":"is a software restore of the firmware on your H2 no sensor.","startTime":8.38,"finishTime":11.84},{"text":"A factory reset can fix chronic performance issues with the sensor,","startTime":12.609,"finishTime":16.37},{"text":"i.e.,","startTime":16.559,"finishTime":16.959},{"text":"freezing,","startTime":16.969,"finishTime":17.52},{"text":"but it does not remove the sensor's operating system","startTime":17.77,"finishTime":20.559},{"text":"or the Wi Fi credentials stored in its memory.","startTime":20.559,"finishTime":23.11},{"text":"To perform a factory reset.","startTime":25.299,"finishTime":27.1},{"text":"Remove power from the sensor.","startTime":28.43,"finishTime":30.19},{"text":"Press and hold the reset button on the face of the sensor.","startTime":32.24,"finishTime":35.77},{"text":"Connect power to the sensor while continuing to press and hold the reset button.","startTime":37.869,"finishTime":42.88},{"text":"Continue pressing the reset button for 6 seco e=\"0.5s\"/>\u003cbreak time=\"0.5s\"/>If the sensor has a FAST BLINKING ORANGE L E D instead of a FAST BLINKING GREEN L E D , this means that the sensor cannot connect to the Internet via Wi-Fi to download a new version of the sensor firmware.\u003cbreak time=\"0.5s\"/> \u003cbreak time=\"0.4s\"/>\u003cbreak time=\"0.5s\"/>The issue may be caused by the following:\u003cbreak time=\"0.5s\"/>\u003cbreak time=\"0.3s\"/>\u003cbreak time=\"0.5s\"/>Incorrect Wi-Fi credentials stored in the sensor’s memory\u003cbreak time=\"0.5s\"/>\u003cbreak time=\"0.3s\"/>\u003cbreak time=\"0.5s\"/>A weak Wi-Fi signal where the sensor is located\u003cbreak time=\"0.5s\"/>\u003cbreak time=\"0.3s\"/>\u003cbreak time=\"0.5s\"/>Wi-Fi router issues.\u003cbreak time=\"0.5s\"/>\u003cbreak time=\"0.4s\"/>\u003cbreak time=\"0.5s\"/>Please ensure strong Wi-Fi signal strength or reset the Wi-Fi credentials stored in the sensor’s memory.\u003cbreak time=\"0.5s\"/>\u003cbreak time=\"0.3s\"/>\u003cbreak time=\"0.5s\"/>Refer to the following slide for steps on resetting the H2KNOW sensors Wi-Fi credentials.\u003c/voice>\n          \u003c/speak>"},"captionData":{"status":"success","captions":[{"text":"H2 no factory reset process continued.","startTime":0.09,"finishTime":2.99},{"text":"If the sensor has a fast blinking orange LED instead of a fast blinking green LED,","startTime":4.42,"finishTime":9.71},{"text":"this means that the sensor cannot connect to the internet via","startTime":10.029,"finishTime":13.029},{"text":"Wi Fi to download a new version of the sensor firmware.","startTime":13.029,"finishTime":16.158},{"text":"The issue may be caused by the following.","startTime":18.35,"finishTime":20.53},{"text":"Incorrect Wi Fi credentials stored in the sensor's memory.","startTime":21.62,"finishTime":25.079},{"text":"A weak Wi Fi signal where the sensor is located.","startTime":26.2,"finishTime":29.139},{"text":"Wi Fi router issues.","startTime":30.35,"finishTime":31.79},{"text":"Please ensure strong Wi Fi signal strength or reset","startTime":34.02,"finishTime":37.18},{"text":"the Wi Fi credentials stored in the sensor's memory.","startTime":37.18,"finishTime":39.939},{"text":"Refer to the following slide for steps on","startTime":42.04,"finishTime":44.119},{"text":"resetting the H2O sensor's Wi Fi credentials.","startTime":44.119,"finishTime":47.36}]}},"XuuLBxji6cSKAyMoM":{"_id":"XuuLBxji6cSKAyMoM","_siteID":"XcX7HcEayLDYteC3A","data":{"attributes":{"type":"audio","mimetype":"audio/mpeg","status":"online","fileSizeInBytes":2115648,"uploadedFileName":"Abbi-en-H2KnowFactoryResetProcess-11102026.mp3","uploadedFileNameExtension":".mp3","duration":88.125},"dates":{"dateCreated":"2026-11-10T18:45:32.983Z","dateModified":"2026-11-10T18:45:40.174Z"},"users":{"_userCreatorID":"tdNHj7vG9WimsAdvJ","_userModifierID":"tdNHj7vG9WimsAdvJ"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"dgYN78sGSvHc7Wcpj","source":"textToSpeech","textToSpeechData":{"prompt":"Step 1: Put the Sensor into Wi-Fi Reset Mode\n\nDisconnect the power: Unplug the power cable from the H2KNOW unit.\n\nHold the Reset button: Press and hold down the hardware Reset button on the face of the sensor.\n\nReconnect power: Plug the power cable back in while continuing to hold the Reset button down.\n\nRelease on Orange: Release the button as soon as you see the Orange L E D light up. An orange light indicates the unit is successfully in \"Reset Mode\".\n\nStep 2: Clear and Update Credentials in the App\n\nOpen the H2KNOW App on your smartphone.\n\nNavigate to the main menu and select Deployment.\n\nTap on Single Sensor Set-up.\n\nSelect the option that says Blinking Orange.\n\nFollow the on-screen prompts to confirm you want to reset the Wi-Fi settings. When asked to confirm, select Yes—this safely erases the old network name and password from the sensor's memory.\n\nSelect your new Wi-Fi network and type in.\n\nFor H2Know programming steps select the arrow icon to View/Download Budde  orange light indicates the unit is successfully in &quot;Reset Mode&quot;.\u003c/li>\n\t\u003c/ul>\n\t\u003c/li>\n\t\u003cli>\u003cspan style=\"font-size:23.799999999999997px\">\u003cstrong>Step 2: Clear and Update Credentials in the App\u003c/strong>\u003c/span>\n\t\u003cul>\n\t\t\u003cli>Open the H2KNOW App on your smartphone.\u003c/li>\n\t\t\u003cli>Navigate to the main menu and select Deployment.\u003c/li>\n\t\t\u003cli>Tap on Single Sensor Set-up.\u003c/li>\n\t\t\u003cli>Select the option that says Blinking Orange.\u003c/li>\n\t\t\u003cli>Follow the on-screen prompts to confirm you want to reset the Wi-Fi settings. When asked to confirm, select Yes&mdash;this safely erases the old network name and password from the sensor&#39;s memory.\u003c/li>\n\t\t\u003cli>Select your new Wi-Fi network and type in.\n\t\t\u003cdiv>&nbsp;\u003c/div>\n\t\t\u003c/li>\n\t\u003c/ul>\n\t\u003c/li>\n\u003c/ul>\n","identifier":"RFjnax7DGD9LCzhsy","kind":"overlay","height":499.00000000000006,"y":110,"x":15,"flipHorizontal":false,"flipVertical":false,"type":"svgShape","svgShape":"rect","start":0,"behaviorType":"continue","rotationAngle":0,"entranceAnimation":{"type":"fadeIn","duration":500},"exitAnimation":{"type":"fadeOut","duration":500},"customStyle":{"type":"rectangle","lineHeight":1.2,"textAlignment":"left","verticalAlignment":"top","font":{"size":16,"bold":false,"italic":false,"underline":false,"family":"u3Zvd3Ld7op2LnY8o"},"roundedCorners":{"topLeft":0,"topRight":0,"bottomLeft":0,"bottomRight":0},"border":{"color":"koantic(accent1, 5, 1)","size":0,"left":true,"top":true,"bottom":true,"right":true},"fill":{"type":"color","color":"transparent"},"padding":{"bottom":0,"top":0,"left":0,"right":0},"fontColor":"rgba(0, 0, 0, 1)"}},{"identifier":"kHNWDkCDSHRkh5ZKT","kind":"overlay","htmlContent":"\u003cdiv>\u003cspan style=\"color:rgba(19, 101, 59, 1)\">H2Know Factory Reset Process\u003c/span>\u003c/div>\n","height":46,"width":600,"y":25,"x":49,"flipHorizontal":false,"flipVertical":fal : Unplug the power cable from the H2KNOW unit.\n\nHold the Reset button: Press and hold down the hardware Reset button on the face of the sensor.\n\nReconnect power: Plug the power cable back in while continuing to hold the Reset button down.\n\nRelease on Orange: Release the button as soon as you see the Orange L E D light up. An orange light indicates the unit is successfully in \"Reset Mode\".\n\nStep 2: Clear and Update Credentials in the App\n\nOpen the H2KNOW App on your smartphone.\n\nNavigate to the main menu and select Deployment.\n\nTap on Single Sensor Set-up.\n\nSelect the option that says Blinking Orange.\n\nFollow the on-screen prompts to confirm you want to reset the Wi-Fi settings. When asked to confirm, select Yes—this safely erases the old network name and password from the sensor's memory.\n\nSelect your new Wi-Fi network and type in.\n\nFor H2Know programming steps select the arrow icon to View/Download Budderfly’s H2Know Sensor Programming & Installation Guide.\n","jobId":"YsRoNoYdxFwjzij3m","featureAdoption":{"isAddingPauses":true,"isUsingMultipleVoices":false,"isAdjustingSpeed":false},"voiceCodeUsed":"en-GB-AbbiNeural"}},"7oLhiNfL2Qfyuiquq":{"_id":"7oLhiNfL2Qfyuiquq","_siteID":"XcX7HcEayLDYteC3A","data":{"attributes":{"locale":"en","template":"resourceSlide","title":"Introduction to H2Know","upload":"E7awDEnT45QKswRtJ"},"dates":{"dateCreated":"2026-11-09T19:07:45.894Z","dateModified":"2026-11-10T17:11:02.200Z"},"users":{"_userCreatorID":"tdNHj7vG9WimsAdvJ","_userModifierID":"tdNHj7vG9WimsAdvJ"},"video":{"autoPlay":true,"overlays":[{"width":603,"height":463,"x":55,"y":149,"rotationAngle":0,"identifier":"xrjfLeJpyeTcHjRC3","kind":"overlay","type":"rectangle","entranceAnimation":{"type":"fadeIn","duration":500},"exitAnimation":{"type":"fadeOut","duration":500},"customStyle":{"verticalAlignment":"middle","type":"rectangle","lineHeight":1.2,"textAlignment":"center","border":{"color":"koantic(accent1, 5, 1)","size":1,"left":true,"top":true,"bottom": alse,"type":"svgShape","svgShape":"custom","start":0,"behaviorType":"continue","rotationAngle":0,"customStyle":{"type":"rectangle","lineHeight":1.2,"textAlignment":"center","verticalAlignment":"middle","font":{"size":22.857142857142858,"bold":false,"italic":false,"underline":false,"family":"u3Zvd3Ld7op2LnY8o"},"roundedCorners":{"topLeft":0,"topRight":0,"bottomLeft":0,"bottomRight":0},"border":{"color":"koantic(accent1, 5, 1)","size":0,"left":true,"top":true,"bottom":true,"right":true},"fill":{"type":"gradient","color":"rgba(19, 101, 59, 1)","gradientType":"linear","color2":"rgba(133, 196, 64, 1)","angle":80},"padding":{"bottom":3.428571428571429,"top":3.428571428571429,"left":6.857142857142858,"right":6.857142857142858},"fontColor":"rgba(255, 255, 255, 1)"},"customSvgShape":"M0,0L0.9828,0C0.9923,0,1,0.1839,1,0.4107L1,0.5893C1,0.8161,0.9923,1,0.9828,1L0,1L0,0Z"}]},{"identifier":"6e6MFoRZxpAwXvZPn","kind":"overlay","htmlContent":"\u003cdiv>\u003cspan style=\"color:rgba(0, 0, 0, 1)\">A factory reset, also known as hard reset or master reset, is a software restore of the firmware on your H2know sensor. A factory reset can fix chronic performance issues with the sensor (i.e. freezing), but it does not remove the sensor&rsquo;s operating system or the Wi-Fi credentials stored in its memory.&nbsp;\u003c/span>\u003c/div>\n\n\u003cdiv>\u003cspan style=\"color:rgba(0, 0, 0, 1)\">&nbsp;\u003c/span>\u003c/div>\n\n\u003cdiv>\u003cspan style=\"color:rgba(0, 0, 0, 1)\">\u003cstrong>To perform a factory reset:&nbsp;\u003c/strong>\u003c/span>\u003c/div>\n\n\u003cul>\n\t\u003cli>\u003cspan style=\"color:rgba(0, 0, 0, 1)\">\u003cspan style=\"font-size:24px\">Remove power from the sensor.\u003c/span>\u003c/span>\u003c/li>\n\t\u003cli>\u003cspan style=\"color:rgba(0, 0, 0, 1)\">\u003cspan style=\"font-size:24px\">Press and hold the &ldquo;Reset&rdquo; button on the face of the sensor.\u003c/span>\u003c/span>\u003c/li>\n\t\u003cli>\u003cspan style=\"color:rgba(0, 0, 0, 1)\">\u003cspan style=\"font-size:24px\">Connect power to the sensor while continuing to press and hold the &ldquo;Reset&rdquo; button.\u003c/span>\u003c/span>\u003c/li>\n\t\u003cli>\u003cspan style=\"color:rgba(0, 0, 0, 1)\">\u003cspan style=\"font-size:24px\">Continue pressing the &ldquo;Reset&rdquo; button for 6 seconds, then release the button.\u003c/span>\u003c/span>\u003c/li>\n\t\u003cli>\u003cspan style=\"color:rgba(0, 0, 0, 1)\">\u003cspan style=\"font-size:24px\">The sensor should come up with a FAST BLINKING \u003c/span>\u003c/span>\u003cspan style=\"color:rgba(0, 176, 80, 1)\">\u003cspan style=\"font-size:24px\">\u003cstrong>GREEN\u003c/strong>\u003c/span>\u003c/span>\u003cspan style=\"color:rgba(0, 0, 0, 1)\">\u003cspan style=\"font-size:24px\"> LED.\u003c/span>\u003c/span>\n\t\u003cul>\n\t\t\u003cli>\u003cspan style=\"color:rgba(0, 0, 0, 1)\">\u003cspan style=\"font-size:21.3px\">(i.e. 200 msec GREEN on, 200 msec off, repeat).&nbsp;\u003c/span>\u003c/span>\u003c/li>\n\t\u003c/ul>\n\t\u003c/li>\n\t\u003cli>\u003cspan style=\"color:rgba(0, 0, 0, 1)\">\u003cspan style=\"font-size:24px\">In approximately 3 minutes (or less), the sensor should reboot and display a SLOW BLINKING \u003c/span>\u003c/span>\u003cspan style=\"color:rgba(0, 176, 80, 1)\">\u003cspan style=\"font-size:24px\">\u003cstrong>GREEN\u003c/strong>\u003c/span>\u003c/span>\u003cspan style=\"color:rgba(0, 0, 0, 1)\">\u003cspan style=\"font-size:24px\"> LED.\u003c/span>\u003c/span>\n\t\u003cul>\n\t\t\u003cli>\u003cspan style=\"color:rgba(0, 0, 0, 1)\">\u003cspan style=\"font-size:21.3px\">(i.e. 50 msec \u003c/span>\u003c/span>\u003cspan style=\"color:rgba(0, 176, 80, 1)\">\u003cspan style=\"font-size:21.3px\">\u003cstrong>GREEN\u003c/strong>\u003c/span>\u003c/span>\u003cspan style=\"color:rgba(0, 0, 0, 1)\">\u003cspan style=\"font-size:21.3px\"> on, 3 seconds off, repeat). \u003c/span>\u003c/span>\u003c/li>\n\t\t\u003cli>\u003cspan style=\"color:rgba(0, 0, 0, 1)\">\u003cspan style=\"font-size:21.3px\">This indicates the software on the sensor has been restored and the sensor is actively transmitting data.\u003c/span>\u003c/span>\u003c/li>\n\t\u003c/ul>\n\t\u003c/li>\n\u003c/ul>\n","height":543,"width":1173,"y":100,"x":33,"flipHorizontal":false,"flipVertical":false,"type":"svgShape","svgShape":"rect","start":0,"behaviorType":"continue","rotationAngle":0,"entranceAnimation":{"type":"fadeIn","duration":500},"exitAnimation":{"type":"fadeOut","duration":500},"customStyle":{"type":"rectangle","lineHeight":1.2,"textAlignment":"left","verticalAlignment":"top","font":{"size":19.047618593488423,"bold":false,"italic":false,"underline":false,"family":"u3Zvd3Ld7op2LnY8o"},"roundedCorners":{"topLeft":0,"topRight":0,"bottomLeft":0,"bottomRight":0},"border":{"color":"koantic(accent1, 5, 1)","size":0,"left":true,"top":true,"bottom":true,"right":true},"fill":{"type":"color","color":"transparent"},"padding":{"bottom":0,"top":0,"left":0,"right":0},"fontColor":"rgba(0, 0, 0, 1)"}},{"identifier":"AZuBQzdrtgS6pnciJ","kind":"overlay","htmlContent":"\u003cdiv>\u003cspan style=\"color:rgba(19, 101, 59, 1)\">H2Know Factory Reset Process\u003c/span>\u003c/div>\n","height":46,"width":600,"y":25,"x":49,"flipHorizontal":false,"flipVertical":false,"type":"svgShape","svgShape":"rect","start":0,"behaviorType":"continue","rotationAngle":0,"entranceAnimation":{"type":"fadeIn","duration":500},"exitAnimation":{"type":"fadeOut","duration":500},"customStyle":{"type":"rectangle","lineHeight":1.0799999713897706,"textAlignment":"left","verticalAlignment":"top","font":{"size":26.666665758405415,"bold":true,"italic":false,"underline":false,"family":"u3Zvd3Ld7op2LnY8o"},"roundedCorners":{"topLeft":0,"topRight":0,"bottomLeft":0,"bottomRight":0},"border":{"color":"koantic(accent1, 5, 1)","size":0,"left":true,"top":true,"bottom":true,"right":true},"fill":{"type":"color","color":"transparent"},"padding":{"bottom":0,"top":0,"left":0,"right":0},"fontColor":"rgba(19, 101, 59, 1)"}},{"identifier":"AsoRjneBZodGTbGMf","kind":"o u003cspan style=\"font-size:24px\">\u003cstrong>Orange / Amber Light Sequences\u003c/strong>\u003c/span>\u003c/span>\u003c/div>\n\n\u003cul>\n\t\u003cli>\u003cspan style=\"color:rgba(0, 0, 0, 1)\">\u003cstrong>Solid Orange\u003c/strong>\u003c/span>\u003cspan style=\"color:rgba(0, 0, 0, 1)\">: The sensor is in Reset / Deployment Mode. This occurs when you hold down the physical reset button during a power cycle, indicating the unit has cleared its saved Wi-Fi credentials and is waiting for you to configure a new network via the app.\u003c/span>\u003c/li>\n\t\u003cli>\u003cspan style=\"color:rgba(0, 0, 0, 1)\">\u003cstrong>Blinking Orange\u003c/strong>\u003c/span>\u003cspan style=\"color:rgba(0, 0, 0, 1)\">: The sensor is actively trying to pair or connect to a localized provisioning network during the initial steps of the setup wizard.\u003c/span>\u003c/li>\n\u003c/ul>\n\n\u003cdiv>&nbsp;\u003c/div>\n\n\u003cdiv>\u003cspan style=\"color:rgba(0, 0, 0, 1)\">​​​​​​​\u003c/span>🔴 \u003cspan style=\"background-color:transparent\">\u003cspan style=\"font-size:24px\">\u003cstrong>Red Light Sequences \u003c/strong>\u003c/span>\u003c/span>\u003cspan style=\"background-color:transparent\">\u003cspan style=\"font-size:24px\">(\u003c/span>\u003c/span>\u003cspan style=\"background-color:transparent; color:#ff0000\">\u003cspan style=\"font-size:24px\">\u003cstrong>Troubleshooting\u003c/strong>\u003c/span>\u003c/span>\u003cspan style=\"background-color:transparent\">\u003cspan style=\"font-size:24px\">)\u003c/span>\u003c/span>\u003c/div>\n\n\u003cul>\n\t\u003cli>\u003cspan style=\"color:rgba(0, 0, 0, 1)\">\u003cstrong>Blinking Red\u003c/strong>\u003c/span>\u003cspan style=\"color:rgba(0, 0, 0, 1)\">: The sensor has lost its connection to the Wi-Fi network or cannot reach the internet.\u003c/span>\u003c/li>\n\t\u003cli>\u003cspan style=\"color:rgba(0, 0, 0, 1)\">\u003cstrong>Solid Red\u003c/strong>\u003c/span>\u003cspan style=\"color:rgba(0, 0, 0, 1)\">: Indicates a general power fa
